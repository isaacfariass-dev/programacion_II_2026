<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Materias — SICRA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 py-4">
    <div th:replace="~{fragments/mensajes :: mensajes}"></div>

    <div class="row align-items-center mb-4 g-3">
        <div class="col-md-6">
            <h1 class="h3 fw-bold text-dark mb-1">
                <i class="bi bi-book-fill text-primary me-2"></i>Catálogo de Materias
            </h1>
            <p class="text-muted mb-0 small">Asignaturas cargadas en los distintos planes de estudio.</p>
        </div>
        <div class="col-md-6 text-md-end">
            <a th:href="@{/materias/nueva}" class="btn btn-primary fw-semibold">
                <i class="bi bi-plus-circle me-1"></i> Nueva Materia
            </a>
        </div>
    </div>

    <!-- Filtro por Carrera -->
    <div class="card shadow-sm border-0 mb-4 bg-light">
        <div class="card-body py-2">
            <form method="get" th:action="@{/materias}" class="row align-items-center g-2">
                <div class="col-auto">
                    <label for="carreraId" class="col-form-label fw-semibold small">Filtrar por Carrera:</label>
                </div>
                <div class="col-auto flex-grow-1" style="max-width: 400px;">
                    <select id="carreraId" name="carreraId" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option value="" th:selected="${carreraSeleccionadaId == null}">-- Todas las Carreras --</option>
                        <option th:each="c : ${carreras}"
                                th:value="${c.idCarrera}"
                                th:text="${c.codigo + ' — ' + c.nombre}"
                                th:selected="${c.idCarrera == carreraSeleccionadaId}">
                        </option>
                    </select>
                </div>
                <div class="col-auto" th:if="${carreraSeleccionadaId != null}">
                    <a th:href="@{/materias}" class="btn btn-outline-secondary btn-sm">Limpiar filtro</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla de Materias -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="ps-4">Código</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Carrera</th>
                            <th scope="col">Año</th>
                            <th scope="col">Cuatrimestre</th>
                            <th scope="col">Carga Horaria</th>
                            <th scope="col" class="text-end pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(materias)}">
                            <td colspan="7" class="text-center py-4 text-muted">
                                No hay materias cargadas para el criterio seleccionado.
                            </td>
                        </tr>
                        <tr th:each="m : ${materias}">
                            <td class="ps-4">
                                <span class="badge bg-secondary font-monospace" th:text="${m.codigo}"></span>
                            </td>
                            <td class="fw-semibold text-dark" th:text="${m.nombre}"></td>
                            <td class="text-muted small" th:text="${m.carrera != null ? m.carrera.nombre : 'Sin carrera'}"></td>
                            <td>
                                <span class="badge bg-primary text-white" th:text="'Año ' + ${m.anioPlan}"></span>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border small" th:text="${m.cuatrimestre}"></span>
                            </td>
                            <td class="small text-muted" th:text="${m.cargaHoraria + ' hs'}"></td>
                            <td class="text-end pe-4">
                                <a th:href="@{/materias/{id}/correlatividades(id=${m.idMateria})}" class="btn btn-outline-warning text-dark btn-sm me-1" title="Gestionar Correlatividades">
                                    <i class="bi bi-diagram-3-fill"></i> Correlativas
                                </a>
                                <a th:href="@{/materias/editar/{id}(id=${m.idMateria})}" class="btn btn-outline-primary btn-sm me-1" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form method="post" th:action="@{/materias/eliminar/{id}(id=${m.idMateria})}" class="d-inline"
                                      onsubmit="return confirm('¿Seguro que deseas eliminar esta materia?');">
                                    <button type="submit" class="btn btn-outline-danger btn-sm" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    <div class="container">
        <strong>SICRA</strong> — UTN INSPT 2026
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
