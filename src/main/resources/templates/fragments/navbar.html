<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>

<nav th:fragment="navbar" class="sicra-navbar">

    <!-- Marca / Logo -->
    <a th:href="@{/plan}" class="brand">
        <span class="brand-dot"></span>
        SICRA
    </a>

    <!-- Links de navegación según rol -->
    <ul class="nav-links" th:if="${session.usuarioLogueado != null}">

        <!-- Alumno ve: Plan y Simulador -->
        <th:block th:if="${session.usuarioLogueado.rol.name() == 'ALUMNO'}">
            <li>
                <a th:href="@{/plan}">
                    <i class="bi bi-grid-3x3-gap-fill" style="margin-right:0.3rem;font-size:0.85rem;"></i>
                    Malla Curricular
                </a>
            </li>
            <li>
                <a th:href="@{/plan/simulador}">
                    <i class="bi bi-lightning-charge-fill" style="margin-right:0.3rem;font-size:0.85rem;"></i>
                    Simulador
                </a>
            </li>
            <li>
                <a th:href="@{/selector-carrera}">
                    <i class="bi bi-arrow-left-right" style="margin-right:0.3rem;font-size:0.85rem;"></i>
                    Cambiar Carrera
                </a>
            </li>
        </th:block>

        <!-- Admin ve: Carreras y Materias -->
        <th:block th:if="${session.usuarioLogueado.rol.name() == 'ADMIN'}">
            <li>
                <a th:href="@{/carreras}">
                    <i class="bi bi-journal-bookmark-fill" style="margin-right:0.3rem;font-size:0.85rem;"></i>
                    Carreras
                </a>
            </li>
            <li>
                <a th:href="@{/materias}">
                    <i class="bi bi-book-fill" style="margin-right:0.3rem;font-size:0.85rem;"></i>
                    Materias
                </a>
            </li>
        </th:block>

    </ul>

    <!-- Zona derecha: chip de usuario + logout -->
    <div class="nav-right" th:if="${session.usuarioLogueado != null}">

        <div class="user-chip">
            <div class="user-avatar"
                 th:text="${#strings.substring(session.usuarioLogueado.nombreUsuario, 0, 1).toUpperCase()}">
                U
            </div>
            <span th:text="${session.usuarioLogueado.nombreUsuario}">usuario</span>
            <span style="color:#cbd5e1; margin: 0 0.1rem;">·</span>
            <span th:text="${session.usuarioLogueado.rol.name()}"
                  style="color:#94a3b8; font-size:0.72rem; text-transform: uppercase; letter-spacing:0.04em;">
                ROL
            </span>
        </div>

        <a th:href="@{/logout}" class="btn-logout" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right" style="margin-right:0.3rem;"></i>
            Salir
        </a>

    </div>

</nav>

</body>
</html>
