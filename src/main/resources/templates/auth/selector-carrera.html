<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Carrera — SICRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="selector-page">

<div class="selector-card">

    <!-- Badge superior -->
    <div class="selector-header">
        <div class="selector-badge">
            <i class="bi bi-mortarboard-fill"></i>
            <span th:text="${carrerasFiltradas == null} ? 'Paso 1 de 2' : 'Paso 2 de 2'">Paso 1 de 2</span>
        </div>
        <h1 class="selector-title">Seleccioná tu Carrera</h1>
        <p class="selector-subtitle">
            Elegí la facultad y carrera para ver tu malla curricular.
        </p>
    </div>

    <!-- Error si la carrera no fue válida -->
    <div class="selector-error" th:if="${errorSelector != null}">
        <i class="bi bi-exclamation-circle-fill" style="margin-right:0.4rem;"></i>
        <span th:text="${errorSelector}">La selección no es válida.</span>
    </div>

    <!-- Paso 1: elegir Facultad / Institución (recarga la página filtrando en el servidor) -->
    <form th:action="@{/selector-carrera}" method="get" style="margin-bottom: 1.25rem;">
        <label for="selectInstitucion" class="form-label-sicra">
            <i class="bi bi-building" style="margin-right:0.3rem;"></i>
            Facultad / Institución
        </label>
        <div style="display:flex; gap:0.5rem;">
            <select id="selectInstitucion" name="institucion" class="form-select-sicra">
                <option value="">— Seleccioná una institución —</option>
                <option th:each="inst : ${instituciones}"
                        th:value="${inst}"
                        th:text="${inst}"
                        th:selected="${inst == institucionSeleccionada}">
                </option>
            </select>
            <button type="submit" class="btn-primary-sicra" style="width:auto; white-space:nowrap;">
                Filtrar
            </button>
        </div>
    </form>

    <!-- Paso 2: elegir Carrera, ya filtrada por el servidor según la institución elegida -->
    <form th:if="${carrerasFiltradas != null}" th:action="@{/selector-carrera}" method="post">

        <div style="margin-bottom: 1rem;">
            <label for="carreraId" class="form-label-sicra">
                <i class="bi bi-journal-bookmark-fill" style="margin-right:0.3rem;"></i>
                Carrera
            </label>
            <select id="carreraId" name="carreraId" class="form-select-sicra" required>
                <option value="">— Seleccioná una carrera —</option>
                <option th:each="c : ${carrerasFiltradas}"
                        th:value="${c.idCarrera}"
                        th:text="${c.nombre}"
                        th:title="${'Código: ' + c.codigo + ' · Duración: ' + c.duracionAnios + ' años'}">
                </option>
            </select>
            <p th:if="${#lists.isEmpty(carrerasFiltradas)}" class="selector-subtitle" style="margin-top:0.5rem;">
                No hay carreras disponibles para esa institución.
            </p>
        </div>

        <button type="submit"
                class="btn-primary-sicra"
                th:disabled="${#lists.isEmpty(carrerasFiltradas)}">
            <i class="bi bi-grid-3x3-gap-fill" style="margin-right: 0.4rem;"></i>
            Ver mi Malla Curricular
        </button>

    </form>

    <!-- Enlace para cerrar sesión -->
    <p style="text-align:center; margin-top:1.5rem; font-size:0.8rem; color:#94a3b8;">
        ¿No sos vos?
        <a th:href="@{/logout}" style="color:#3b5bdb; text-decoration:none; font-weight:500;">
            Cerrar sesión
        </a>
    </p>

</div>

</body>
</html>
