<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — SICRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="login-page">

<div class="login-card">

    <!-- Logo / Ícono de la app -->
    <div class="login-logo">
        <i class="bi bi-diagram-3-fill"></i>
    </div>

    <h1 class="login-title">Bienvenido a SICRA</h1>
    <p class="login-subtitle">Sistema de Correlatividades Universitarias · UTN INSPT</p>

    <!-- Mensaje de error si las credenciales son incorrectas -->
    <div class="login-error" th:if="${errorLogin != null}">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${errorLogin}">Usuario o contraseña incorrectos.</span>
    </div>

    <!-- Formulario de Login -->
    <form th:action="@{/login}" method="post" autocomplete="off">

        <div style="margin-bottom: 1rem;">
            <label for="nombreUsuario" class="form-label-sicra">Usuario</label>
            <input
                type="text"
                id="nombreUsuario"
                name="nombreUsuario"
                class="form-control-sicra"
                placeholder="Ingresá tu nombre de usuario"
                required
                autofocus>
        </div>

        <div style="margin-bottom: 1.5rem;">
            <label for="clave" class="form-label-sicra">Contraseña</label>
            <input
                type="password"
                id="clave"
                name="clave"
                class="form-control-sicra"
                placeholder="••••••••"
                required>
        </div>

        <button type="submit" class="btn-primary-sicra">
            <i class="bi bi-box-arrow-in-right" style="margin-right: 0.4rem;"></i>
            Iniciar Sesión
        </button>

    </form>

    <!-- Pie de la tarjeta -->
    <p style="text-align:center; margin-top:1.5rem; font-size:0.78rem; color:#94a3b8;">
        ¿Problemas para acceder? Contactá al administrador del sistema.
    </p>

</div>

</body>
</html>
