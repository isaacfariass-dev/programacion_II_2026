<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tituloError ?: 'Error'}">Error - SICRA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            max-width: 520px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
        }
        .error-badge {
            display: inline-block;
            background-color: #fee2e2;
            color: #b91c1c;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            margin-bottom: 1.25rem;
        }
        h1 {
            font-size: 1.6rem;
            margin: 0 0 1rem;
            color: #0f172a;
        }
        p {
            color: #475569;
            font-size: 1rem;
            line-height: 1.5;
            margin: 0 0 1.75rem;
        }
        .btn-volver {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .btn-volver:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <span class="error-badge" th:text="${codigoEstado != null ? ('Código ' + codigoEstado) : 'Aviso'}">Aviso</span>
        <h1 th:text="${tituloError ?: 'Ha ocurrido un inconveniente'}">Error</h1>
        <p th:text="${mensajeError ?: 'No se pudo procesar la solicitud.'}">Detalle del error.</p>
        <a href="javascript:history.back()" class="btn-volver">Volver a la página anterior</a>
    </div>
</body>
</html>
