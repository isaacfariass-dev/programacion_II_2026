<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${esEdicion ? 'Editar Carrera' : 'Nueva Carrera'} + ' — SICRA'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div th:replace="~{fragments/mensajes :: mensajes}"></div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="card-title h6 mb-0 fw-bold">
                        <i class="bi bi-journal-plus me-2" th:classappend="${esEdicion ? 'bi-journal-check' : 'bi-journal-plus'}"></i>
                        <span th:text="${esEdicion ? 'Editar Carrera' : 'Registrar Nueva Carrera'}"></span>
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form method="post" th:action="@{/carreras/guardar}" th:object="${carrera}">
                        <input type="hidden" th:field="*{idCarrera}">

                        <div class="mb-3">
                            <label for="codigo" class="form-label fw-semibold">Código:</label>
                            <input type="text" id="codigo" th:field="*{codigo}" class="form-control" required placeholder="Ej: TUP, ISI">
                            <div class="form-text">Identificador único de la carrera.</div>
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre:</label>
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required placeholder="Ej: Tecnicatura Universitaria en Programación">
                        </div>

                        <div class="mb-3">
                            <label for="institucion" class="form-label fw-semibold">Institución:</label>
                            <input type="text" id="institucion" th:field="*{institucion}" class="form-control" required placeholder="Ej: UTN - INSPT">
                        </div>

                        <div class="mb-4">
                            <label for="duracionAnios" class="form-label fw-semibold">Duración (en años):</label>
                            <input type="number" min="1" max="10" id="duracionAnios" th:field="*{duracionAnios}" class="form-control" required placeholder="Ej: 2, 3 o 5">
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/carreras}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary fw-semibold">
                                <i class="bi bi-save me-1"></i> Guardar Carrera
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    <div class="container">
        <strong>SICRA</strong> — UTN INSPT 2026
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
