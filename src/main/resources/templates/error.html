<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-th-text="${tituloError ?: 'Error'}">Error - SICRA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 20% 20%, #e0e7ff 0, transparent 40%),
                        radial-gradient(circle at 80% 80%, #fce7f3 0, transparent 40%), #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.18);
            max-width: 520px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
            animation: aparecer 0.4s ease-out;
        }
        .error-icono {
            font-size: 3.5rem;
            display: inline-block;
            animation: flotar 3s ease-in-out infinite;
        }
        .error-codigo {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            margin: 0.25rem 0 0.5rem;
            background: linear-gradient(135deg, #2563eb, #db2777);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .error-frase {
            font-style: italic;
            color: #94a3b8;
            margin: 0 0 1.25rem;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.75rem;
            color: #0f172a;
        }
        p {
            color: #475569;
            font-size: 1rem;
            line-height: 1.5;
            margin: 0 0 1.75rem;
        }
        .acciones {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.15s ease, background-color 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primario { background-color: #2563eb; color: #ffffff; }
        .btn-primario:hover { background-color: #1d4ed8; }
        .btn-secundario { background-color: #f1f5f9; color: #334155; }
        .btn-secundario:hover { background-color: #e2e8f0; }

        @keyframes flotar {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-10px) rotate(4deg); }
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!--/* Declaración de variables del Model para compatibilidad con validadores de IDE */-->
    <!--/*@thymesVar id="tituloError" type="java.lang.String"*/-->
    <!--/*@thymesVar id="mensajeError" type="java.lang.String"*/-->
    <!--/*@thymesVar id="codigoEstado" type="java.lang.Integer"*/-->

    <div class="error-card" data-th-with="codigo=${codigoEstado ?: 0}">
        <span class="error-icono" data-th-switch="${codigo}">
            <span data-th-case="404">🧭</span>
            <span data-th-case="400">🤔</span>
            <span data-th-case="500">🛠️</span>
            <span data-th-case="*">⚠️</span>
        </span>

        <div class="error-codigo" data-th-text="${codigo != 0 ? codigo : 'Ups'}">Ups</div>

        <p class="error-frase" data-th-switch="${codigo}">
            <span data-th-case="404">Parece que esta materia no figura en el plan de estudios...</span>
            <span data-th-case="400">Algo no cierra con las correlativas.</span>
            <span data-th-case="500">Nuestro sistema se llevó la materia a marzo. Ya lo estamos revisando.</span>
            <span data-th-case="*">Algo salió distinto a lo esperado.</span>
        </p>

        <h1 data-th-text="${tituloError ?: 'Ha ocurrido un inconveniente'}">Error</h1>
        <p data-th-text="${mensajeError ?: 'No se pudo procesar la solicitud.'}">Detalle del error.</p>

        <div class="acciones">
            <a href="javascript:history.back()" class="btn btn-secundario">← Volver</a>
            <a data-th-href="@{/}" href="/" class="btn btn-primario">Ir al inicio</a>
        </div>
    </div>
</body>
</html>
