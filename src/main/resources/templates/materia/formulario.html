<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${esEdicion ? 'Editar Materia' : 'Nueva Materia'} + ' — SICRA'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div th:replace="~{fragments/mensajes :: mensajes}"></div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="card-title h6 mb-0 fw-bold">
                        <i class="bi me-2" th:classappend="${esEdicion ? 'bi-pencil-square' : 'bi-plus-circle'}"></i>
                        <span th:text="${esEdicion ? 'Editar Asignatura' : 'Registrar Nueva Asignatura'}"></span>
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form method="post" th:action="@{/materias/guardar}" th:object="${materia}">
                        <input type="hidden" th:field="*{idMateria}">

                        <div class="mb-3">
                            <label for="carreraId" class="form-label fw-semibold">Carrera:</label>
                            <select id="carreraId" name="carreraId" class="form-select" required>
                                <option value="" disabled th:selected="${materia.carrera == null}">-- Seleccione una carrera --</option>
                                <option th:each="c : ${carreras}"
                                        th:value="${c.idCarrera}"
                                        th:text="${c.codigo + ' — ' + c.nombre}"
                                        th:selected="${materia.carrera != null && materia.carrera.idCarrera == c.idCarrera}">
                                </option>
                            </select>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-5">
                                <label for="codigo" class="form-label fw-semibold">Código:</label>
                                <input type="text" id="codigo" th:field="*{codigo}" class="form-control" required placeholder="Ej: PROG-1">
                            </div>
                            <div class="col-md-7">
                                <label for="nombre" class="form-label fw-semibold">Nombre:</label>
                                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required placeholder="Ej: Programación I">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label for="anioPlan" class="form-label fw-semibold">Año del Plan:</label>
                                <input type="number" min="1" max="6" id="anioPlan" th:field="*{anioPlan}" class="form-control" required placeholder="1, 2, 3">
                            </div>
                            <div class="col-md-4">
                                <label for="cuatrimestre" class="form-label fw-semibold">Cuatrimestre:</label>
                                <select id="cuatrimestre" th:field="*{cuatrimestre}" class="form-select" required>
                                    <option th:each="cuat : ${cuatrimestres}"
                                            th:value="${cuat}"
                                            th:text="${cuat}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="cargaHoraria" class="form-label fw-semibold">Carga Horaria (hs):</label>
                                <input type="number" min="1" id="cargaHoraria" th:field="*{cargaHoraria}" class="form-control" required placeholder="Ej: 64">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/materias}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary fw-semibold">
                                <i class="bi bi-save me-1"></i> Guardar Materia
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    <div class="container">
        <strong>SICRA</strong> — UTN INSPT 2026
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
